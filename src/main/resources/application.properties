server.port=8086
spring.application.name=review-service
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

#Three lines below only runs when started in IDE, if started through docker, the environment variables gets injected into Spring automatically.
spring.datasource.url=jdbc:mysql://localhost:3306/${database_name:review_service}
spring.datasource.username=${database_username:root}
spring.datasource.password=${database_password:rootpassword}

user.service.url=${USER_SERVICE_URL:http://localhost:8084/api/v1/users}

app.jwt.secret=${JWT_SECRET:en_superhemlig_default_nyckel_som_ar_minst_32_tecken_lang}
