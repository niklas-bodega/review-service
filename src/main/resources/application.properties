server.port=8086
spring.application.name=review-service
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:review_service}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:rootpassword}

user.service.url=${USER_SERVICE_URL:http://localhost:8084/api/v1/users}

app.jwt.secret=${JWT_SECRET:en_superhemlig_default_nyckel_som_ar_minst_32_tecken_lang}